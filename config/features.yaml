# What `trentino_dataset.parquet` is allowed to contain. A column not declared here is an
# error, and so is a declared column that does not arrive.
#
# Values on a category are defaults for every column under it; a column entry overrides them.
# `min` and `max` are plausibility bounds, not observed extremes.

categories:
  identity:
    source: "M3 sampling"
    role: key
    columns:
      sample_id: {dtype: int32}
      cell_id: {dtype: int32}
      date: {dtype: "datetime64[us]"}

  labels:
    source: "PAT fire cadastre"
    role: label
    columns:
      is_fire: {dtype: bool}
      is_near_fire: {dtype: bool}
      fire_id: {dtype: Int64, nullable: true}
      n_fires: {dtype: int16}

  provenance:
    source: "join keys resolved at assembly"
    role: diagnostic
    columns:
      clc_edition: {dtype: int16}
      worldpop_year: {dtype: int16}
      veg_composite_date: {dtype: "datetime64[us]", nullable: true}
      natura2000_fraction: {dtype: float32, min: 0.0, max: 1.0}

  topography:
    source: "Copernicus DEM GLO-30 via Earth Engine"
    provider: "Copernicus DEM GLO-30"
    period: "static (TanDEM-X acquisitions 2011-2015)"
    resolution: "30 m to 500 m"
    license: "© DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA"
    url: "https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_DEM_GLO30_2024_1"
    temporal: static
    forecastable: true
    dtype: float32
    columns:
      elevation_mean: {min: "config:topography.min_elevation_m", max: "config:topography.max_elevation_m"}
      elevation_std: {min: 0.0, max: 1000.0}
      slope_mean: {min: 0.0, max: 90.0}
      slope_std: {min: 0.0, max: 90.0}
      roughness_mean: {min: 0.0, max: 1000.0}
      roughness_std: {min: 0.0, max: 1000.0}
      aspect_NODATA: {min: 0.0, max: 1.0}
      aspect_1: {min: 0.0, max: 1.0}
      aspect_2: {min: 0.0, max: 1.0}
      aspect_3: {min: 0.0, max: 1.0}
      aspect_4: {min: 0.0, max: 1.0}
      aspect_5: {min: 0.0, max: 1.0}
      aspect_6: {min: 0.0, max: 1.0}
      aspect_7: {min: 0.0, max: 1.0}
      aspect_8: {min: 0.0, max: 1.0}

  geography:
    source: "grid lattice; PAT hydrography"
    provider: "PAT, idrografia SIAT"
    period: "static"
    resolution: "vector to 500 m"
    license: "PAT open data"
    url: "https://siat.provincia.tn.it/"
    temporal: static
    forecastable: true
    dtype: float32
    columns:
      # EPSG:25832 easting and northing of the cell center, bounded by the province
      x_coordinate: {dtype: float64, min: 600000.0, max: 740000.0}
      y_coordinate: {dtype: float64, min: 5050000.0, max: 5170000.0}
      waterbody_fraction: {min: 0.0, max: 1.0}
      is_waterbody: {dtype: bool}

  landcover:
    source: "CORINE Land Cover, edition nearest in time"
    provider: "CORINE Land Cover"
    period: "1990 / 2000 / 2006 / 2012 / 2018"
    resolution: "100 m to 500 m"
    license: "Copernicus, free and open"
    url: "https://land.copernicus.eu/en/products/corine-land-cover"
    temporal: static
    forecastable: true
    dtype: float32
    min: 0.0
    max: 1.0
    columns:
      CLC_1: {}
      CLC_2: {}
      CLC_3: {}
      CLC_4: {}
      CLC_5: {}
      CLC_6: {}
      CLC_7: {}
      CLC_8: {}
      CLC_9: {}
      CLC_10: {}
      CLC_11: {}
      CLC_12: {}
      CLC_13: {}
      CLC_14: {}
      CLC_15: {}
      CLC_16: {}
      CLC_17: {}
      CLC_18: {}
      CLC_19: {}
      CLC_20: {}
      CLC_21: {}
      CLC_22: {}
      CLC_23: {}
      CLC_24: {}
      CLC_25: {}
      CLC_26: {}
      CLC_27: {}
      CLC_28: {}
      CLC_29: {}
      CLC_30: {}
      CLC_31: {}
      CLC_32: {}
      CLC_33: {}
      CLC_34: {}
      CLC_35: {}
      CLC_36: {}
      CLC_37: {}
      CLC_38: {}
      CLC_39: {}
      CLC_40: {}
      CLC_41: {}
      CLC_42: {}
      CLC_43: {}
      CLC_44: {}
      CLC_L2_11: {}
      CLC_L2_12: {}
      CLC_L2_13: {}
      CLC_L2_14: {}
      CLC_L2_21: {}
      CLC_L2_22: {}
      CLC_L2_23: {}
      CLC_L2_24: {}
      CLC_L2_31: {}
      CLC_L2_32: {}
      CLC_L2_33: {}
      CLC_L2_41: {}
      CLC_L2_42: {}
      CLC_L2_51: {}
      CLC_L2_52: {}
      CLC_L1_1: {}
      CLC_L1_2: {}
      CLC_L1_3: {}
      CLC_L1_4: {}
      CLC_L1_5: {}

  human:
    source: "OpenStreetMap via Overpass; Natura 2000 from the PAT SIAT shapefile;
      WorldPop via Earth Engine (WorldPop/GP/100m/pop)"
    provider: "OpenStreetMap, WorldPop, Natura 2000"
    period: "OSM snapshot; Natura 2000 2019; WorldPop 2000-2020"
    resolution: "vector and 100 m to 500 m"
    license: "ODbL (OSM); CC BY 4.0 (WorldPop); PAT open data (Natura 2000)"
    url: "https://www.openstreetmap.org/copyright"
    temporal: static
    forecastable: true
    dtype: float32
    columns:
      # distances are metric, over the 25 sub-points of a 500 m cell: the mean can reach the
      # width of the province, the spread cannot exceed the cell's own diagonal
      dist_roads_mean: {min: 0.0, max: 100000.0}
      dist_roads_std: {min: 0.0, max: 500.0}
      dist_railways_mean: {min: 0.0, max: 100000.0}
      dist_railways_std: {min: 0.0, max: 500.0}
      dist_waterways_mean: {min: 0.0, max: 100000.0}
      dist_waterways_std: {min: 0.0, max: 500.0}
      recreational_poi_density: {min: 0.0, max: 1000.0}
      accommodation_density: {min: 0.0, max: 1000.0}
      natura2000: {dtype: bool}
      pop_density: {min: 0.0, max: "config:human.max_pop_density_km2"}

  calendar:
    source: "derived from the date, no external source"
    provider: "Python holidays"
    period: "any date"
    resolution: "daily"
    license: "computed"
    url: "https://pypi.org/project/holidays/"
    temporal: dynamic
    forecastable: true
    columns:
      month: {dtype: int8, min: 1, max: 12}
      season: {dtype: category}
      day_of_week: {dtype: int8, min: 0, max: 6}
      is_weekend: {dtype: bool}
      is_holiday: {dtype: bool}

  vegetation:
    source: "Landsat C2 L2 via Earth Engine (LT04, LT05, LE07, LC08, LC09), monthly
      composites, last one ending before the sample date"
    provider: "Landsat 4/5/7/8/9 Collection 2"
    period: "1984-2024, monthly composites"
    resolution: "30 m to 500 m"
    license: "USGS, public domain"
    url: "https://www.usgs.gov/landsat-missions/landsat-collection-2-level-2-science-products"
    temporal: dynamic
    forecastable: true
    dtype: float32
    nullable: true
    columns:
      ndvi: {min: "config:vegetation.min_index", max: "config:vegetation.max_index"}
      ndwi: {min: "config:vegetation.min_index", max: "config:vegetation.max_index"}
      nbr: {min: "config:vegetation.min_index", max: "config:vegetation.max_index"}
      lst: {min: "config:vegetation.min_lst_c", max: "config:vegetation.max_lst_c"}
      valid_fraction: {min: 0.0, max: 1.0}
      snow_fraction: {min: 0.0, max: 1.0}
      age_days: {min: 0.0, max: "config:vegetation.max_fill_days"}

  meteo:
    source: "ERA5-Land, bilinear from the four surrounding backbone cells"
    provider: "ERA5-Land (ECMWF)"
    period: "1984 to 2026, hourly to daily"
    resolution: "0.1 degrees (~9 km), 0.25 degrees on the served tail"
    license: "Copernicus, free and open"
    url: "https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_LAND_HOURLY"
    temporal: dynamic
    forecastable: true
    dtype: float32
    columns:
      temp_mean: {min: "config:meteo.min_temp_c", max: "config:meteo.max_temp_c"}
      temp_min: {min: "config:meteo.min_temp_c", max: "config:meteo.max_temp_c"}
      temp_max: {min: "config:meteo.min_temp_c", max: "config:meteo.max_temp_c"}
      temp_range: {min: 0.0, max: 60.0}
      rh_mean: {min: 0.0, max: 100.0}
      rh_min: {min: 0.0, max: 100.0}
      rh_max: {min: 0.0, max: 100.0}
      rh_range: {min: 0.0, max: 100.0}
      pres_mean: {min: "config:meteo.min_pressure_hpa", max: "config:meteo.max_pressure_hpa"}
      pres_min: {min: "config:meteo.min_pressure_hpa", max: "config:meteo.max_pressure_hpa"}
      pres_max: {min: "config:meteo.min_pressure_hpa", max: "config:meteo.max_pressure_hpa"}
      pres_range: {min: 0.0, max: 100.0}
      precip_sum: {min: 0.0, max: "config:meteo.max_precip_mm"}
      wind_speed_mean: {min: 0.0, max: 100.0}
      wind_speed_max: {min: 0.0, max: 100.0}
      wind_dir_mean: {min: 0.0, max: 360.0}
      wind_dir_at_max: {min: 0.0, max: 360.0}
      temp_noon: {min: "config:meteo.min_temp_c", max: "config:meteo.max_temp_c"}
      rh_noon: {min: 0.0, max: 100.0}
      wind_speed_noon: {min: 0.0, max: 100.0}
      precip_noon24: {min: 0.0, max: "config:meteo.max_precip_mm"}
      # volumetric soil water, m3/m3, bounded by the saturation of any real soil
      soil_water_l1_mean: {min: 0.0, max: 1.0}
      soil_water_l2_mean: {min: 0.0, max: 1.0}
      # a cumulative window can hold several days at the daily ceiling
      precip_cum7: {min: 0.0, max: 1000.0}
      precip_cum15: {min: 0.0, max: 1500.0}
      precip_cum30: {min: 0.0, max: 2000.0}
      temp_mean_3d: {min: "config:meteo.min_temp_c", max: "config:meteo.max_temp_c"}
      rh_mean_7d: {min: 0.0, max: 100.0}

  fwi:
    source: "Canadian FWI on the ERA5-Land backbone, nearest cell"
    provider: "Canadian Forest Fire Weather Index"
    period: "1984 to 2026"
    resolution: "as the ERA5-Land backbone"
    license: "computed with xclim"
    url: "https://xclim.readthedocs.io/"
    temporal: dynamic
    forecastable: true
    dtype: float32
    columns:
      fwi: {min: 0.0, max: "config:fwi.max_fwi"}
      ffmc: {min: 0.0, max: "config:fwi.max_ffmc"}
      dmc: {min: 0.0, max: "config:fwi.max_dmc"}
      dc: {min: 0.0, max: "config:fwi.max_dc"}
      isi: {min: 0.0, max: "config:fwi.max_isi"}
      bui: {min: 0.0, max: "config:fwi.max_bui"}

  stacking:
    # written by `tfire train-mesogeos`, which the assembly does not run itself, so the table
    # is valid at 137 features before the base model exists and 138 after
    source: "XGBoost on the Mesogeos Mediterranean tracks, scored on the Trentino values"
    provider: "Mesogeos"
    period: "2006-2022"
    resolution: "1 km"
    license: "CC BY 4.0"
    url: "https://github.com/Orion-AI-Lab/mesogeos"
    temporal: dynamic
    forecastable: true
    dtype: float32
    optional: true
    columns:
      mesogeos_prob: {min: 0.0, max: 1.0}
