project:
  random_seed: 42

crs: "EPSG:25832" # ETRS89 / UTM 32N, native to the PAT data. Never reproject.
resolution_m: 500

# fires.parquet is not clipped to this range, it's a faithful parse of the whole cadastre.
date_range:
  start: "1984-01-01"
  end: "2024-12-31"

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  fires_shapefile: "data/raw/pat_fires/Incendi__date.shp"
  fires_out: "data/interim/fires.parquet"
  fire_polygons_out: "data/interim/fire_polygons.parquet"
  pat_boundary: "data/raw/pat_boundary/ammprv_v.shp"
  pat_waterbodies: "data/raw/pat_hydro/idrspacq.shp"
  corine_raw: "data/raw/corine"
  corine_out: "data/interim/corine"
  dem_raster: "data/raw/dem/glo30_terrain_500m.tif"
  grid_out: "data/interim/grid.parquet"
  grid_spec_out: "data/interim/grid_spec.json"
  samples_out: "data/interim/samples.parquet"
  exclusions_out: "data/interim/exclusions.parquet"
  topography_out: "data/interim/topography.parquet"
  geography_out: "data/interim/geography.parquet"
  landcover_out: "data/interim/landcover.parquet"
  era5_raw: "data/raw/era5land"
  era5_weights_out: "data/interim/era5_weights.parquet"
  meteo_out: "data/interim/meteo_daily.parquet"
  fwi_out: "data/interim/fwi.parquet"
  bias_map_out: "data/interim/bias_map.parquet"
  fire_history_out: "data/interim/fire_history.parquet"
  climatology_out: "data/interim/climatology.parquet"
  landsat_raw: "data/raw/landsat"
  vegetation_out: "data/interim/vegetation.parquet"
  vegetation_climatology_out: "data/interim/vegetation_climatology.parquet"
  vegetation_missingness_out: "data/interim/vegetation_missingness.parquet"
  pat_natura2000: "data/raw/natura2000/Habitat_2019.shp"
  osm_cache: "data/raw/osm/cache"
  worldpop_raster: "data/raw/worldpop/pop_density.tif"
  human_out: "data/interim/human.parquet"
  human_population_out: "data/interim/human_population.parquet"
  mesogeos_raw: "data/raw/mesogeos"
  mesogeos_model_dir: "models/mesogeos"
  trentino_model_dir: "models/trentino"
  dataset_out: "data/processed/trentino_dataset.parquet"
  quality_report_out: "data/processed/data_quality.json"
  sensitivity_dir: "data/interim/sensitivity"
  forecast_cache: "data/raw/forecast"
  operational_dir: "data/interim/operational"
  risk_dir: "data/processed/risk"
  overlay_dir: "data/processed/risk/overlays"
  jobs_dir: "data/processed/jobs"
  app_state_out: "data/processed/app_state.json"
  runtime_manifest_out: "data/processed/runtime_manifest.json"
  frontend_dir: "app/frontend"
  report_dir: "reports"
  figures_dir: "reports/figures"

corine:
  # 5 km of slack around the boundary. A 500 m cell straddling the border needs
  # 100 m pixels from outside it, otherwise its class proportions don't sum to 1.
  # 5 km is 10 cells, comfortably more than any grid alignment offset.
  margin_m: 5000

  # source rasters are European-wide, one per edition. filenames encode the
  # production year, not the reference year, hence the mismatch.
  editions:
    1990: "clc-1990/DATA/U2000_CLC1990_V2020_20u1.tif"
    2000: "clc-2000/DATA/U2006_CLC2000_V2020_20u1.tif"
    2006: "clc-2006/DATA/U2012_CLC2006_V2020_20u1.tif"
    2012: "clc-2012/DATA/U2018_CLC2012_V2020_20u1.tif"
    2018: "clc-2018/DATA/U2018_CLC2018_V2020_20u1.tif"

grid:
  # a cell is active when its center falls inside the boundary: 24,842 of the
  # 45,864 bounding-box cells. The province is 6210 km2, so 24,841 cells' worth
  # of area, which is the cross-check that the mask is placed right.
  expected_active_cells: 24842

  # the cropped rasters carry CLC grid codes 1-44, not the 3-digit codes.
  # 1 continuous urban fabric, 31 bare rocks, 34 glaciers and perpetual snow,
  # 40 water courses, 41 water bodies. 32 (sparsely vegetated areas) is left out:
  # it covers 829 km2 of the province and sparse vegetation burns.
  non_burnable_clc_codes: [1, 31, 34, 40, 41]
  non_burnable_threshold: 0.5
  non_burnable_clc_edition: 2018

sources:
  # for cropping Earth Engine requests only. the real mask is the PAT boundary
  # in EPSG:25832.
  bbox_wgs84:
    north: 46.6
    west: 10.4
    south: 45.6
    east: 12.0

  # Cloud project bound to the Earth Engine account
  gee_project: "trentino-fire-risk"

  # Copernicus DEM GLO-30, release 2024.1
  dem_collection: "COPERNICUS/DEM/GLO30_2024_1"

  # slope, aspect and roughness are computed at this resolution in the working CRS,
  # then aggregated to 500 m. GLO-30 is nominally 30 m.
  dem_scale_m: 30

fires:
  expected_row_count: 3187
  min_valid_timestamps: 3174

  # near_midnight = hour >= 22 or hour < 2 -> 366 records (11.48%)
  near_midnight_start_hour: 22
  near_midnight_end_hour: 2

  # suspicious_default_time = 0 <= hour <= 2 -> 200 records (6.28%). The 00:00 to
  # 02:00 spike is very likely placeholder times entered when the real hour was unknown.
  suspicious_time_max_hour: 2

  # Number of rows expected to need the DD/MM/YYYY -> scalar field repair
  # (the 2025 records, where the provider changed the field format).
  expected_normalized_rows: 13

topography:
  # bounds for the plausibility check on elevation_mean
  min_elevation_m: 0
  max_elevation_m: 4200

geography:
  # majority rule, same threshold as the non-burnable mask
  waterbody_threshold: 0.5

meteo:
  # the hourly product, not the post-processed daily statistics: relative humidity and wind
  # speed are nonlinear in these fields, so they have to be derived hour by hour and only
  # then aggregated. Daily means of dewpoint or of u/v cannot recover the right answer.
  variables:
    - "2m_temperature"
    - "2m_dewpoint_temperature"
    - "surface_pressure"
    - "total_precipitation"
    - "10m_u_component_of_wind"
    - "10m_v_component_of_wind"
    - "volumetric_soil_water_layer_1"
    - "volumetric_soil_water_layer_2"

  # Trentino runs on UTC+1 standard time. Fire weather is defined on local standard time,
  # so a day spans 23:00 UTC to 23:00 UTC and noon LST is the 11:00 UTC record.
  utc_offset_hours: 1

  # years fetched before date_range.start and then dropped. Gives precip_cum30 a full
  # history at 1984-01-01 and lets DC and DMC settle before the first emitted day.
  spinup_years: 1

  extension_end: 2026-06-30

  # Earth Engine returns 503 past 8 concurrent downloads, and `getDownloadURL` refuses more
  # than 1024 bands, which 120 hours x 8 variables sits just under.
  gee_workers: 8
  gee_window_hours: 120

  precip_windows: [7, 15, 30]
  temp_window_days: 3
  rh_window_days: 7

  # plausibility bounds for the daily aggregates.
  min_temp_c: -45.0
  max_temp_c: 45.0
  min_pressure_hpa: 550.0
  max_pressure_hpa: 1060.0
  max_precip_mm: 500.0

history:
  # how far an ignition is taken to say something about its neighbourhood. 2.5 km is five
  # cells, wide enough that 0.13 events per cell becomes a readable field and narrow enough
  # that a valley's history does not leak over the ridge into the next one.
  bandwidth_m: 2500

  # years of cadastre behind each target year. The whole record would let the 1980s decide a
  # 2026 map.
  window_years: 15

climatology:
  # read as a percentile inside the cell's own distribution for the calendar month. The raw
  # value says how dry it is, the anomaly says how dry it is for here in August, and a model
  # given only the first learns the province's geography instead of the day's weather.
  columns:
    - "fwi"
    - "precip_cum30"

bias:
  # Open-Meteo serves the wind from ERA5 at 0.25 degrees while the backbone is ERA5-Land at
  # 0.1, and over this terrain the coarser grid runs 36% high on the daily mean and 40% on the
  # maximum. Temperature and humidity come off ERA5-Land on both paths and agree to three decimals;
  # pressure and precipitation move by under 3%. Only the wind is corrected, and the direction
  # columns are left alone: they are circular, and a quantile map on a compass bearing is meaningless.
  columns:
    - "wind_speed_mean"
    - "wind_speed_max"
    - "wind_speed_noon"

  # the overlap the two distributions are compared on. Long enough for a per-cell, per-month
  # quantile to stand on more than a handful of days, recent enough to be the same ERA5 stream
  # the operational path serves today.
  reference_years: [2020, 2024]

fwi:
  # ceilings for the plausibility check. FFMC is bounded at 101 by construction; the
  # others are open-ended, so these are what a 41-year alpine record should stay under.
  max_ffmc: 101.0
  max_dmc: 1000.0
  max_dc: 1500.0
  max_isi: 200.0
  max_bui: 1000.0
  max_fwi: 200.0

  # the per-value ceilings above sit far enough from the record that a systematic inflation
  # would pass under them. The province-wide daily mean is the quantity that catches one:
  # it peaks at 15.4 over the whole record, in August 2003, so 30 leaves room for a hotter
  # August than any on file and still fails on a doubling.
  max_mean_fwi: 30.0

  # DC returns to near zero every spring on winter rain rather than on a seasonal mask.
  # Alpine winters are wet enough that 98.6% of cell-years fall under the start-up value of
  # 15 at some point in March or April; a DC that integrated without resetting would not.
  spring_reset_dc: 15.0
  min_spring_reset_share: 0.95

vegetation:
  # Collection 2 Tier-1 Level-2 surface reflectance. Five sensors are needed to span 1984-2024.
  collections:
    - "LANDSAT/LT04/C02/T1_L2"
    - "LANDSAT/LT05/C02/T1_L2"
    - "LANDSAT/LE07/C02/T1_L2"
    - "LANDSAT/LC08/C02/T1_L2"
    - "LANDSAT/LC09/C02/T1_L2"

  # months per Earth Engine request. Each request composites every scene in the window at
  # 30 m and reduces to 500 m server side.
  chunk_months: 3

  # snow gives a nonsense NDVI, so it is masked out of the indices and reported separately
  # as snow_fraction.
  mask_snow: true

  # below this share of clear 30 m pixels the cell's composite is an average of too few
  # observations to trust, and is dropped in favor of the carried-forward value.
  min_valid_fraction: 0.2

  # how long a value may be carried forward before the cell goes missing instead. Four
  # months spans an alpine winter without pretending a June observation describes October.
  max_fill_days: 120

  climatology_min_years: 5

  # what a cell-month with no observation inside max_fill_days gets.
  no_observation_strategy: "nan"

  # normalized differences are bounded by construction; these catch a scaling error.
  min_index: -1.0
  max_index: 1.0
  min_lst_c: -50.0
  max_lst_c: 60.0

human:
  # sub-points per side of an evenly spaced grid inside each 500 m cell, used to estimate
  # dist_*_{mean,std} via a shapely STRtree. OSM isn't on Earth Engine, so there is no
  # server-side reduceResolution the way DEM sub-pixels get one; this is the local
  # equivalent. 5x5 = 25 points/cell is enough given how sparse the road/rail/waterway
  # network is relative to a 500 m cell.
  osm_distance_subpoints_per_side: 5

  osm_overpass_timeout_s: 300

  # majority rule, same convention as geography.waterbody_threshold
  natura2000_threshold: 0.5

  # WorldPop/GP/100m/pop covers 2000-2020. Five editions mirror corine.editions' choice of
  # a handful of representative years rather than fetching all 21 annual layers.
  worldpop_collection: "WorldPop/GP/100m/pop"
  worldpop_years: [2000, 2005, 2010, 2015, 2020]

  # plausibility ceiling for the province's most crowded cell (central Trento)
  max_pop_density_km2: 20000.0

sampling:
  negative_ratio: 10

  # level-3 exclusion around each burned polygon, in cells and in days. 1 cell is 500 m:
  # 168,709 excluded (cell, date) pairs, 166,252 of them on an active cell and inside the
  # window. That subset is what the case-control offset takes off 24,842 x 14,976, leaving
  # 371,867,540 candidate negatives. The rest fall where a negative could not be drawn anyway.
  buffer_cells: 1
  buffer_days: 2

  # hard negatives are drawn from high-FWI days without ignition, so they cannot
  # exist before M5. Any value above 0 raises.
  hard_negative_fraction: 0.0

  # 3,174 fires inside date_range, minus 5 whose cell center falls outside the
  # boundary, minus 14 that share a (cell_id, date) with a larger fire.
  expected_positives: 3155

mesogeos:
  # a track is 30 consecutive days at 1 km pixel; the last one is the day the fire started.
  # every other row is lead-up, kept only for the cumulative precipitation windows.
  track_length_days: 30

  # last three years of the record, held out to measure the base model before it is refitted
  holdout_years: [2020, 2021, 2022]

  max_depth: 6
  n_estimators: 400
  learning_rate: 0.05
  early_stopping_rounds: 30

trentino:
  # artifacts land in models/trentino/<version>/.
  version: "v2"

  test_years_start: 2015

  # cut points of the danger classes the map legend shows, as percentiles of the calibrated
  # probability over the whole grid, every stride-th day of the holdout years. A whole-grid
  # reference rather than the sampled negatives: it is the population the map actually draws.
  danger_percentiles: [90.0, 99.0, 99.9, 99.99]
  danger_reference_stride: 1

  cv_folds: 5

  optuna_trials: 100
  early_stopping_rounds: 50
  max_estimators: 2000

  random_forest:
    n_estimators: 500
    min_samples_leaf: 5

  logistic:
    max_iter: 2000
    c: 1.0

evaluation:
  # share of the scored rows a responder could act on, for precision/recall at the top of the
  # ranking. Global fractions, not per day: the sampled table holds too few rows per date.
  precision_at_k: [0.01, 0.05, 0.10]

  # quantile bins. Uniform ones leave the upper half empty at a 3.5% base rate.
  calibration_bins: 10

  # spatial blocks for the second CV. 20 km over a 117 x 96 km province is ~30 blocks, enough
  # that no fold is one corner of Trentino, wide enough that a block's interior is far from
  # any training cell.
  spatial_block_m: 20000
  spatial_folds: 5

  # resamples behind the 95% intervals on the holdout scores. 276 positives is few enough that
  # differences of a few thousandths need the interval to be read at all.
  bootstrap_resamples: 1000

  shap_max_display: 20
  figure_dpi: 300

  # negative ratios the sensitivity run rebuilds, against the 1:10 of sampling.negative_ratio
  negative_ratios: [5, 20]

dataset:
  expected_rows: 34705
  expected_features: 139

forecast:
  archive_url: "https://archive-api.open-meteo.com/v1/archive"
  forecast_url: "https://api.open-meteo.com/v1/forecast"

  # `era5_land` on its own carries only temperature and dewpoint. `era5_seamless` serves those
  # two from ERA5-Land at 0.1 degrees, on the backbone's own lattice, and takes pressure,
  # precipitation and wind from ERA5 at 0.25 degrees.
  archive_model: "era5_seamless"
  forecast_model: "ecmwf_ifs025"

  # the same six fields the backbone carries. relative humidity and wind speed are derived
  # from these hour by hour, not requested ready-made.
  variables:
    - "temperature_2m"
    - "dew_point_2m"
    - "surface_pressure"
    - "precipitation"
    - "wind_speed_10m"
    - "wind_direction_10m"

  horizon_days: 10

  # the archive ran 6 days behind and the forecast endpoint's own past reached 63 days back.
  # both carry a margin.
  forecast_past_days: 60
  archive_latency_days: 7

  # history fetched before the first predicted day. DC has the longest memory of the FWI
  # codes, and 30 of these days are what precip_cum30 needs on its own. Spin-up comes from
  # the archive whenever it reaches, so this is not bounded by forecast_past_days.
  spinup_days: 90

  # lattice points per request. 187 in one URL is within the length the API accepts, but
  # splitting keeps a single failure from costing the whole province.
  batch_size: 64

  request_timeout_s: 120

  # waits go 2, 4, 8, 16, 32 seconds, so six attempts span more than the minute Open-Meteo's
  # minutely quota takes to clear.
  retry_attempts: 6

app:
  host: "127.0.0.1"
  port: 8000

  # a date with no risk map on disk is predicted while the request waits. Turning this off makes
  # the API serve only what `tfire predict` has already written.
  on_demand: true

  # the grid is 234 x 196 cells, so the warped overlay is already under this. The cap exists so a
  # future finer grid cannot produce a PNG nobody can download.
  overlay_max_px: 2048
  overlay_opacity: 0.75

  session_ttl_minutes: 240
  default_language: "it"

  # min_zoom 8 puts the whole province in a desktop viewport; past 15 the 500 m cells are just
  # large squares over a basemap that keeps getting sharper, which reads as more precision than
  # the data has.
  min_zoom: 8
  max_zoom: 15
  bounds_margin_deg: 0.15

  # offsets from today, inclusive. These dates are kept on disk and are never evicted.
  warm_window_days: [-30, 10]

  cache_max_gb: 5.0

  # 0 disables the limit, which is what browsing the record needs: stepping day by day through
  # 1984-2024 hits far more than a handful of uncached dates in an hour.
  uncached_requests_per_hour: 0

  login_attempts_per_hour: 10
  job_log_tail_lines: 200

  basemaps:
    - key: "osm"
      url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      attribution: "© OpenStreetMap contributors"
    - key: "satellite"
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      attribution: "Esri, Maxar, Earthstar Geographics"
    - key: "relief"
      url: "https://tile.opentopomap.org/{z}/{x}/{y}.png"
      attribution: "© OpenTopoMap (CC-BY-SA), © OpenStreetMap contributors"

logging:
  level: "INFO"
